name: Update stock data
on:
  schedule:
    - cron: '17 10 * * 1-5'   # 6:17pm Malaysia time, after Bursa closes
  workflow_dispatch:
permissions:
  contents: write
concurrency: stocks
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-stocks.mjs
      - name: Commit data
        run: |
          git config user.name "stock-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update stock data $(date -u +%F)"
          git pull --rebase -q origin main
          git push
